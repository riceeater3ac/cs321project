
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item - MasonFind</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <main class="items-page">

        <header class="page-header">
            <h1>
                <i data-lucide="search"></i>
                Report a Lost Item
            </h1>
            <p>Enter the details of your lost item below.</p>
        </header>

        <nav class="items-navigation">
            <a href="{{ url_for('mainpage') }}"
               class="nav-button">
                <i data-lucide="house"></i>
                Back to Dashboard
            </a>

            <a href="{{ url_for('lost_items') }}"
               class="nav-button">
                <i data-lucide="list"></i>
                View Lost Items
            </a>
        </nav>

        <form method="POST"
              action="{{ url_for('report_lost') }}"
              enctype="multipart/form-data">

            <label for="item_name">Item Name</label>
            <input type="text"
                   id="item_name"
                   name="item_name"
                   placeholder="Example: Black Backpack"
                   required>

            <label for="category">Category</label>
            <select id="category"
                    name="category"
                    required>
                <option value="">Select Category</option>
                <option>Electronics</option>
                <option>Clothing</option>
                <option>Books</option>
                <option>Accessories</option>
                <option>Other</option>
            </select>

            <label for="description">Description</label>
            <textarea id="description"
                      name="description"
                      placeholder="Describe your lost item"
                      required></textarea>

            <label for="location">Last Seen Location</label>
            <input type="text"
                   id="location"
                   name="location"
                   placeholder="Example: Fenwick Library"
                   required>

            <label for="date_lost">Date Lost</label>
            <input type="date"
                   id="date_lost"
                   name="date_lost"
                   required>

            <label for="image">Upload Item Photo (Optional)</label>
            <input type="file"
                   id="image"
                   name="image"
                   accept="image/jpeg,image/png,image/webp">

            <p>Upload a photo to help others find your item.</p>

            <button type="submit">
                Submit Lost Item
            </button>
        </form>
    </main>

    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
