
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Lost Item - MasonFind</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Report a Lost Item</h1>
    <p>Enter the details of your lost item.</p>

    <form method="POST" action="{{ url_for('report_lost') }}">
        <label>Item Name</label>
        <input type="text" name="item_name" required
               placeholder="Example: Black Backpack">

        <label>Category</label>
        <select name="category" required>
            <option value="">Select Category</option>
            <option>Electronics</option>
            <option>Clothing</option>
            <option>Books</option>
            <option>Accessories</option>
            <option>Other</option>
        </select>

        <label>Description</label>
        <textarea name="description" required
                  placeholder="Describe your item"></textarea>

        <label>Last Seen Location</label>
        <input type="text" name="location" required
               placeholder="Example: Fenwick Library">

        <label>Date Lost</label>
        <input type="date" name="date_lost" required>

        <button type="submit">Submit Lost Item</button>
    </form>

    <p><a href="{{ url_for('mainpage') }}">Back to Dashboard</a></p>
</body>
</html>
