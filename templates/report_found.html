
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Found Item - MasonFind</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Report a Found Item</h1>
    <p>Enter the details of the item you found.</p>

    <form method="POST"
          action="{{ url_for('report_found') }}"
          enctype="multipart/form-data">

        <label>Item Name</label>
        <input type="text" name="item_name" required
               placeholder="Example: Black Backpack">

        <label>Category</label>
        <select name="category" required>
            <option value="">Select Category</option>
            <option>Electronics</option>
            <option>Clothing</option>
            <option>Books</option>
            <option>Accessories</option>
            <option>Other</option>
        </select>

        <label>Description</label>
        <textarea name="description" required
                  placeholder="Describe the found item"></textarea>

        <label>Location Found</label>
        <input type="text" name="location" required
               placeholder="Example: Fenwick Library">

        <label>Date Found</label>
        <input type="date" name="date_found" required>

        <!-- New Image Upload Field -->
        <label>Upload Item Photo (Optional)</label>
        <input type="file"
               name="image"
               accept="image/jpeg,image/png,image/webp">

        <p>Upload a photo to help identify the item.</p>

        <button type="submit">Submit Found Item</button>
    </form>

    <p><a href="{{ url_for('home') }}">Back to Home</a></p>
</body>
</html>
